[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genkei"
version = "0.1.0"
description = "Genkei Capital research-desk: queryable financial-data lake (equities + crypto)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Michael Tookes" }]
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "testcontainers[postgres]>=4.0",
]
# Experiments / analysis layer (B-054/B-055). Kept OUT of the core deps on
# purpose: the package, CLI, and offline test suite must install and run
# without pandas/jupyter. `genkei.common.notebook` imports pandas lazily, so
# read_sql_rows() + snapshot_manifest() work core-only; read_sql_df() and the
# example notebooks need this extra. Install with: pip install -e ".[notebooks]"
notebooks = [
    "pandas>=2.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "matplotlib>=3.7",
]
# MCP server (B-130) — wraps the `genkei` CLI as a Model Context Protocol
# tool surface for Claude Code, Claude Desktop, Cursor, Codex, and other MCP
# clients. Kept OUT of core deps on purpose (mirrors [notebooks]): the CLI,
# the offline test suite, and the MCP tool registry + adapter all import and
# run without this. Only the running server (`genkei-mcp`) needs it, and the SDK
# requires Python >=3.10 — so it stays optional to keep the package installable
# under the 3.9 harness.
# Install with: pip install -e ".[mcp]"
# Pinned to the 1.x SDK line: `genkei.mcp.server` builds on the low-level
# `mcp.server.Server` decorator API (`@server.list_tools()` / `@server.call_tool()`),
# which the 2.0 SDK removed in favor of a different handler-registration shape.
# An unpinned `mcp>=1.0` floor resolves to 2.x and crashes the server at startup
# (`AttributeError: 'Server' object has no attribute 'list_tools'`), so the
# one-line install path must cap below 2.0 until the server is ported (tracked
# for a follow-up). 1.29.x is the current compatible release.
mcp = [
    "mcp>=1.0,<2",
]
# FastAPI read layer (B-131) — the generic HTTP read API over the lake.
# Kept OUT of core deps on purpose (mirrors [mcp] / [notebooks]): the CLI,
# the offline test suite, and every ingester install and run without it; only
# the running service (`genkei-api`) needs it. Unlike [mcp], FastAPI supports
# Python 3.9, so CI installs this extra alongside [dev] and the endpoint
# contract tests actually execute (they import fastapi.testclient); the local
# 3.9 suite without the extra skips them cleanly. httpx is FastAPI's test
# client dependency and is already a core dep, but pinned here too so the
# extra is self-contained. Install with: pip install -e ".[api]"
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.scripts]
genkei = "genkei.cli:main"
genkei-mcp = "genkei.mcp.server:main"
genkei-api = "genkei.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genkei"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# G-027: Typer evaluates parameter annotations at runtime (not lazily).
# When the local venv is Python 3.9, `X | None` syntax fails at import
# time even with `from __future__ import annotations`. The CLI modules
# use `Optional[X]` instead for cross-version safety; everywhere else
# stays on the modern PEP-604 form.
"src/genkei/cli/*.py" = ["UP045", "UP007"]
# Same runtime-annotation constraint as the CLI (G-027): FastAPI evaluates
# endpoint parameter annotations at runtime to build the request model, so a
# `X | None` param annotation fails at import time under the 3.9 harness even
# with `from __future__ import annotations`. The api modules use `Optional[X]`
# for cross-version safety; keep ruff's PEP-604 rewrite off them.
"src/genkei/api/*.py" = ["UP045", "UP007"]
