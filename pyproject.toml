[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genkei"
version = "0.1.0"
description = "Genkei Capital research-desk: queryable financial-data lake (equities + crypto)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Michael Tookes" }]
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
genkei = "genkei.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genkei"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# G-025: Typer evaluates parameter annotations at runtime (not lazily).
# When the local venv is Python 3.9, `X | None` syntax fails at import
# time even with `from __future__ import annotations`. The CLI modules
# use `Optional[X]` instead for cross-version safety; everywhere else
# stays on the modern PEP-604 form.
"src/genkei/cli/*.py" = ["UP045", "UP007"]
