# Genkei Capital — cross-source signal correlation rules (B-064)
#
# Each rule defines a stack: a configuration of (source, signal_kind)
# components, each with a weight. The correlator walks `meta.signal_events`
# and emits a stack when, within `window_days` on the same asset, the
# weighted-strength score exceeds `min_score` AND at least
# `min_distinct_sources` distinct sources have contributed.
#
# `min_distinct_sources` is load-bearing — without it a single noisy emitter
# firing twice would fake a "multi-source" stack. Default is 2; bump it for
# higher-confidence rules.
#
# Wildcard components use `signal_kind: null` to match any kind from the
# source. Exact-kind components win ties over wildcards when both are
# configured for the same source.
#
# `decay_half_life_days` (optional, B-099) turns on exponential age-decay
# within the window: each event's contribution is scaled by
# `0.5 ** (age_days / half_life)`, measured back from the window's freshest
# event, so recent corroboration counts for more and a stale signal on the
# edge of a wide window can't prop up a stack alone. Omit it (the default)
# for flat, age-blind scoring — the original behavior. Most useful on the
# wide-window rules (`activist_position_take` 60d, `broad_exit` 90d) where
# a two-month-old leg and a same-day one currently count identically.
#
# As of 2026-05-28 only the insider_clusters emitter is wired up (B-064
# ships the reference emitter; B-064.1 / B-064.2 / B-064.3 will add the
# crowding / 8-K / TVL-drawdown emitters). Rules below are pre-configured
# for the full multi-source picture so stacks light up automatically as
# each emitter lands.
version: 1

rules:
  # Bullish stacks — "smart money is piling in"

  - name: smart_money_buy
    description: >-
      Insider buy cluster + 13F crowding add + 8-K material agreement
      filing on the same equity within a week. The canonical institutional-
      stack signal — three independent sources agreeing that something
      is happening.
    direction: bullish
    horizon: equity:core
    window_days: 7
    min_score: 1.5
    min_distinct_sources: 2
    components:
      - source: insider_clusters
        signal_kind: buy_cluster
        weight: 1.0
      - source: crowding
        signal_kind: crowding_add
        weight: 1.0
      - source: eight_k_impact
        signal_kind: item_1_01  # Material Definitive Agreement
        weight: 0.6
      - source: eight_k_impact
        signal_kind: item_2_02  # Results of Operations / earnings
        weight: 0.5

  - name: activist_position_take
    description: >-
      Insider buy cluster + 13F crowding add from a known activist filer
      within a quarter. Wider window because 13F filings lag the actual
      position-take by up to 45 days.
    direction: bullish
    horizon: equity:core
    window_days: 60
    min_score: 1.4
    min_distinct_sources: 2
    components:
      - source: insider_clusters
        signal_kind: buy_cluster
        weight: 1.0
      - source: crowding
        signal_kind: crowding_jump  # ≥3 net new entrants (defined per emitter)
        weight: 1.0

  # Bearish stacks — "smart money is bailing"

  - name: broad_exit
    description: >-
      Insider sell cluster + 13F holders dropping on the same equity
      within a quarter. Sell clusters alone are noisy (10b5-1 plans,
      tax planning); pairing with 13F exits filters most of the noise.
    direction: bearish
    horizon: equity:core
    window_days: 90
    min_score: 1.5
    min_distinct_sources: 2
    components:
      - source: insider_clusters
        signal_kind: sell_cluster
        weight: 1.0
      - source: crowding
        signal_kind: crowding_exit
        weight: 1.0

  - name: deterioration_stack
    description: >-
      8-K disclosure (any item code that historically drove negative
      drift, e.g. 5.02 officer changes / 4.02 non-reliance) plus a
      sell-cluster within a month — the typical "the news is bad and
      insiders aren't waiting" pattern.
    direction: bearish
    horizon: equity:core
    window_days: 30
    min_score: 1.4
    min_distinct_sources: 2
    components:
      - source: insider_clusters
        signal_kind: sell_cluster
        weight: 1.0
      - source: eight_k_impact
        signal_kind: item_5_02  # Officer departures / appointments
        weight: 0.6
      - source: eight_k_impact
        signal_kind: item_4_02  # Non-reliance on prior financials
        weight: 0.8

  # Rel-strength-driven stacks — landed with B-111 (equity rel-strength
  # emitter). The equity analog of the crypto `crypto_tvl_stress_combo`:
  # pair an idiosyncratic price weakness / strength signal with a
  # fundamental / flow signal to confirm direction. The 2026-06-05 SaaS
  # sector research session named this as the engine confluence the
  # equity side was missing — bear-side, paired with insider sell
  # clusters; bull-side, paired with insider buy clusters.

  - name: equity_rel_strength_exit
    description: >-
      Equity rel-strength laggard crossing (30d vs SPY) + insider sell
      cluster on the same name within a month. Pair "name is losing
      relative leadership" with "insiders aren't waiting" — the cleanest
      bearish confluence for equity-core. Wider window than
      deterioration_stack because rel-strength laggard episodes typically
      precede insider activity by a few weeks (and the activity follows
      filings windows + 10b5-1 plan cadence).
    direction: bearish
    horizon: equity:core
    window_days: 60
    min_score: 1.4
    min_distinct_sources: 2
    components:
      - source: equity_relative_strength
        signal_kind: laggard_crossing
        weight: 1.0
      - source: insider_clusters
        signal_kind: sell_cluster
        weight: 1.0

  - name: equity_rel_strength_entry
    description: >-
      Equity rel-strength leader crossing (30d vs SPY) + insider buy
      cluster on the same name within a month. Pair "name is gaining
      relative leadership" with "insiders are buying" — the cleanest
      bullish confluence for equity-core. Wider window than
      smart_money_buy because rel-strength leader episodes can precede
      or follow the insider activity by a few weeks.
    direction: bullish
    horizon: equity:core
    window_days: 60
    min_score: 1.4
    min_distinct_sources: 2
    components:
      - source: equity_relative_strength
        signal_kind: leader_crossing
        weight: 1.0
      - source: insider_clusters
        signal_kind: buy_cluster
        weight: 1.0

  # Crypto-side stacks — first introduced with B-095 (TVL drawdown).
  # Pre-staged for the full picture; until B-098 (relative-strength
  # emitter) lands, the second source isn't live so the rule won't fire
  # an actual stack — same partial-fire pattern the equity-core rules
  # had before B-093 / B-094.

  - name: crypto_tvl_stress_combo
    description: >-
      TVL drawdown stress (B-058 classifier) + relative-strength laggard
      crossing on the same chain's native token within 30d. The crypto-
      sleeve analog of `broad_exit`: on-chain demand contracting AND
      price losing relative leadership at the same time. Pre-staged for
      B-098 (relative_strength_emitter); fires once that emitter lands.
    direction: bearish
    horizon: crypto:core
    window_days: 30
    min_score: 1.5
    min_distinct_sources: 2
    components:
      - source: tvl_drawdown
        signal_kind: tvl_drawdown_stress
        weight: 1.0
      - source: relative_strength
        signal_kind: laggard_crossing
        weight: 1.0

  - name: crypto_tvl_stress_combo_tactical
    description: >-
      Tactical-sleeve twin of `crypto_tvl_stress_combo`. The correlator
      matches events by exact horizon, so the crypto:core rule above can
      never fire for tactical-sleeve tokens (SUI / PYTH / RENDER) even when
      both legs are present — this covers that sleeve. Same shape: TVL
      drawdown stress + relative-strength laggard crossing within 30d.
    direction: bearish
    horizon: crypto:tactical
    window_days: 30
    min_score: 1.5
    min_distinct_sources: 2
    components:
      - source: tvl_drawdown
        signal_kind: tvl_drawdown_stress
        weight: 1.0
      - source: relative_strength
        signal_kind: laggard_crossing
        weight: 1.0

  # Return-anomaly-corroborated stacks — the B-069 follow-up. A violent one-day
  # DOWN move (return_anomaly / return_spike, bearish) is a corroborating leg,
  # not a standalone signal: paired with on-chain demand contracting (crypto)
  # or insiders selling (equity), it's "the price cracked AND <the fundamental
  # is deteriorating>". min_distinct_sources=2 keeps a lone spike from firing.
  # strength on the anomaly leg saturates at |score|≥5 (see anomaly_signal_emitter).

  - name: crypto_price_anomaly_stress
    description: >-
      Return anomaly (sharp bearish price spike) + TVL drawdown stress on the
      same crypto-core native token within 30d. The price-action confirmation
      of `crypto_tvl_stress_combo`: on-chain demand contracting AND the price
      breaking down hard on the same asset.
    direction: bearish
    horizon: crypto:core
    window_days: 30
    min_score: 1.4
    min_distinct_sources: 2
    components:
      - source: return_anomaly
        signal_kind: return_spike
        weight: 1.0
      - source: tvl_drawdown
        signal_kind: tvl_drawdown_stress
        weight: 1.0

  - name: crypto_price_anomaly_stress_tactical
    description: >-
      Tactical-sleeve twin of `crypto_price_anomaly_stress` (exact-horizon
      matching means the crypto:core rule can't fire for SUI / PYTH / RENDER).
      Return anomaly + TVL drawdown stress within 30d.
    direction: bearish
    horizon: crypto:tactical
    window_days: 30
    min_score: 1.4
    min_distinct_sources: 2
    components:
      - source: return_anomaly
        signal_kind: return_spike
        weight: 1.0
      - source: tvl_drawdown
        signal_kind: tvl_drawdown_stress
        weight: 1.0

  - name: equity_price_anomaly_exit
    description: >-
      Return anomaly (sharp bearish price spike) + insider sell cluster on the
      same equity within 30d. The price-action companion to `broad_exit` /
      `deterioration_stack`: the stock gapped down hard AND insiders aren't
      waiting. A single bad-day gap alone (no insider leg) won't fire it.
    direction: bearish
    horizon: equity:core
    window_days: 30
    min_score: 1.4
    min_distinct_sources: 2
    components:
      - source: return_anomaly
        signal_kind: return_spike
        weight: 1.0
      - source: insider_clusters
        signal_kind: sell_cluster
        weight: 1.0
