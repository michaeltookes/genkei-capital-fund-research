# B-106 — curated ETH wallets we snapshot daily for whale-flow tracking.
# See docs/sources/eth-whale-addresses.md for the curation methodology and
# the four hard limits callers must read alongside the data. Addresses are
# lowercased here; the load_watchlist parser also lowercases at read time
# so checksum casing in YAML doesn't matter (Etherscan returns lowercase).
#
# CRITICAL READING NOTE: exchange-category inflow REVERSES the intuitive
# sign — when ETH flows into a CEX cold wallet, that's users preparing to
# sell, not the exchange buying. The other three categories follow the
# intuitive read (custodian inflow = staking commitment, foundation
# outflow = treasury monetization, whale outflow = position trimming).
eth_whale_addresses:
  # foundation
  - address: "0xde0b295669a9fd93d5f28d9ec85e40f4cb697bae"
    label: Ethereum Foundation
    category: foundation
    notes: |
      Etherscan canonical label. Historical role: the EF has sold tranches of
      ETH from this address during bull runs (notably 2021, 2024) — outflow
      is the meaningful supply-side signal. Balance at add-time (2026-06-08):
      ~9,774 ETH.
  - address: "0xab5801a7d398351b8be11c439e05c5b3259aec9b"
    label: Vitalik Buterin (primary)
    category: foundation
    notes: |
      Self-identified on Twitter many times. Smaller than the EF treasury
      but symbolically watched; movement here drives crypto-press cycles.

  # custodian
  - address: "0xae7ab96520de3a18e5e111b5eaab095312d7fe84"
    label: Lido stETH token contract
    category: custodian
    notes: |
      Etherscan canonical label. Holds the modest buffer ETH; the bulk of
      Lido-staked ETH sits in the Beacon Deposit Contract. Inflow here =
      stETH redemptions queued (bearish for ETH conviction); outflow =
      withdrawals settling. Balance at add-time: ~3,157 ETH.
  - address: "0x00000000219ab540356cbb839cbe05303d7705fa"
    label: Eth2 Beacon Deposit Contract
    category: custodian
    notes: |
      Etherscan canonical label. The single largest ETH holder on the
      network — all newly-staked ETH flows here. Net flow against this
      contract is the structural "is ETH being staked or unstaked" signal.
      Pre-Shapella (Apr 2023) it was one-way in; post-Shapella the
      withdrawal credentials let validators exit.
  - address: "0xdc24316b9ae028f1497c275eb9192a3ea0f67022"
    label: Lido stETH/ETH Curve Pool
    category: custodian
    notes: |
      Etherscan canonical label. Material liquidity for the un-stake exit
      path — if the pool balance shifts heavily toward ETH, it signals
      stakers exiting via Curve rather than waiting for the Lido queue.

