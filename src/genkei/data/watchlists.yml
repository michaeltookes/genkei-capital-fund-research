# Macro series watchlist.
#
# Format mirrors FRED series IDs (e.g. DGS10, CPIAUCSL). Macro is the spine
# of the investment philosophy (CLAUDE.md), so this set should grow first
# when something feels under-covered.
#
# Note on DXY: the ICE U.S. Dollar Index (DXY) isn't a FRED series. The
# closest equivalents are DTWEXBGS (broad trade-weighted) or DTWEXAFEGS
# (advanced foreign economies). DXY itself is sourced from market data
# (CoinGecko / equity providers) when needed — added as a placeholder
# entry below in the dollar section.
#
macro_series:
  # Rates
  - id: DFF
    name: Federal Funds Effective Rate
    rationale: Fed policy stance; the entire short end of the curve pivots off this.
  - id: DGS2
    name: 2-Year Treasury Yield
    rationale: Market's expected path of the policy rate.
  - id: DGS10
    name: 10-Year Treasury Yield
    rationale: Risk-free benchmark; equity discount-rate input; growth signal.
  - id: T10Y2Y
    name: 10Y-2Y Treasury Spread
    rationale: Yield-curve slope; recession-signal proxy.
  - id: DGS30
    name: 30-Year Treasury Yield
    rationale: Long-end inflation/term-premium read.

  # Inflation
  - id: CPIAUCSL
    name: Consumer Price Index (All Urban Consumers)
    rationale: Headline inflation; drives Fed policy expectations.
  - id: PCEPI
    name: PCE Price Index
    rationale: Fed's preferred inflation gauge.

  # Growth + labor
  - id: GDPC1
    name: Real GDP
    rationale: Quarterly growth pulse; regime-classifier input.
  - id: UNRATE
    name: Unemployment Rate
    rationale: Labor-market slack; Fed dual-mandate input.
  - id: PAYEMS
    name: Total Nonfarm Payrolls
    rationale: Monthly employment momentum.
  - id: INDPRO
    name: Industrial Production Index
    rationale: Real-economy activity in goods-producing sectors.

  # Liquidity / money
  - id: WALCL
    name: Federal Reserve Balance Sheet (All Liabilities and Capital)
    rationale: Fed liquidity provision; risk-asset tide.
  - id: M2SL
    name: M2 Money Supply
    rationale: Broad money aggregate; long-run inflation/asset-price input.

  # Dollar
  - id: DTWEXBGS
    name: Trade-Weighted U.S. Dollar Index (Broad, Goods + Services)
    rationale: Closest FRED equivalent to DXY; risk-asset crosswind.

  # Credit
  - id: BAMLH0A0HYM2
    name: ICE BofA US High Yield Index Option-Adjusted Spread
    rationale: HY credit spread; risk appetite + recession signal.

  # Volatility / risk
  - id: VIXCLS
    name: CBOE VIX Volatility Index
    rationale: Equity-vol regime indicator.

  # Housing
  - id: HOUST
    name: Housing Starts
    rationale: Rate-sensitive sector pulse; consumer-cycle input.

  # Sentiment
  - id: UMCSENT
    name: University of Michigan Consumer Sentiment
    rationale: Consumer mood; spending leading indicator.

  # Commodities
  - id: DCOILWTICO
    name: WTI Crude Oil Spot Price
    rationale: Inflation + global-growth signal; energy-equity input.

  # Spot gold previously tracked GOLDAMGBD228NLBM (London PM fix), but
  # FRED retired that series (G-020). FRED no longer hosts a live
  # spot-gold series; closest live proxies are GVZCLS (gold volatility)
  # and IQ12260 (monthly gold export-price index). Plan: re-add a real
  # spot gold series via a commodities feed when one lands (Phase 2
  # follow-up — file a backlog item if a need surfaces before then).

# DeFi-protocol watchlist (B-081).
#
# Per-protocol TVL via DefiLlama `/protocol/{slug}` lands in
# `defillama.protocol_tvl` daily. Slug = the protocol's identifier in
# DefiLlama's URL path (visible at https://defillama.com/protocol/<slug>).
#
# Scope is intentionally narrow — full-watchlist iteration of all ~3k
# DefiLlama protocols is reserved for the one-shot `--backfill protocols`
# mode (existing in defillama.py). The daily flow only hits the slugs
# below, keeping the cron under ~30s extra.
protocols:
  primary:
    # Oracle infrastructure — pairs with the LINK crypto-core position
    # (the gap that drove the LINK research session's low-confidence
    # call; see docs/research/decisions/2026-05-17-link-position-assessment.md).
    # DefiLlama doesn't list a top-level `chainlink` slug — the oracle
    # business is split across multiple slugs in their catalog. The
    # protocols collector + the fees collector both iterate every slug
    # here and each soft-fails per-slug when its endpoint has no data,
    # so a slug can participate in only one without breaking the other.
    - slug: chainlink-staking
      name: Chainlink Staking
      category: Oracle
      coingecko_id: chainlink
      rationale: LINK v0.2 staking pool TVL; on-chain staker commitment signal (companion to B-082).
    - slug: chainlink-requests
      name: Chainlink Requests
      category: Oracle
      coingecko_id: chainlink
      rationale: Oracle service demand via DefiLlama fees — `/protocol/` has empty TVL but `/summary/fees/` carries the actual signal (B-083).

    # Lending — the original DeFi primitive; sector-health bellwether.
    - slug: aave-v3
      name: Aave V3
      category: Lending
      coingecko_id: aave
      rationale: Largest lending market on Ethereum; DeFi sector pulse.
    - slug: compound-v3
      name: Compound V3
      category: Lending
      coingecko_id: compound-governance-token
      rationale: Lending-market diversification beyond Aave.

    # DEX — DEX volume + TVL is the most direct activity signal for DeFi.
    - slug: uniswap-v3
      name: Uniswap V3
      category: DEX
      coingecko_id: uniswap
      rationale: Largest DEX by TVL; cross-chain activity benchmark.
    - slug: curve-dex
      name: Curve DEX
      category: DEX
      coingecko_id: curve-dao-token
      rationale: Stablecoin-pair DEX; stable-asset flow indicator.

    # Liquid staking — captures ETH-staking demand as an asset class.
    - slug: lido
      name: Lido
      category: Liquid Staking
      coingecko_id: lido-dao
      rationale: Dominant ETH liquid-staking protocol; stETH supply tracks ETH-staking demand.

    # Stablecoin issuer — MakerDAO rebranded to Sky in 2024 and DefiLlama
    # split it into sky-lending (CDP / lending) + sky-rwa (real-world
    # assets). sky-lending is the closest equivalent to the old MKR/DAI
    # mint-and-borrow primitive.
    - slug: sky-lending
      name: Sky Lending (formerly MakerDAO)
      category: CDP / Stablecoin Issuer
      coingecko_id: sky
      rationale: DAI/USDS supply trajectory; decentralized-stablecoin demand proxy.

    # Sui ecosystem (B-087) — pairs with the SUI crypto-tactical
    # watchlist entry. The 2026-05-20 SUI /research session could see
    # Sui chain TVL ($577M) but couldn't drill into which Sui-native
    # protocols were bottoming vs still bleeding; this section closes
    # that gap. Slugs verified live against `defillama.protocols`
    # (raw blob `gecko_id` was NULL across the board, so coingecko_id
    # values below come from CoinGecko's /search endpoint — symbol +
    # name cross-checked). Ordered by TVL at landing time.
    - slug: navi-lending
      name: NAVI Lending
      category: Lending
      coingecko_id: navi
      rationale: Largest Sui lending market by TVL (~$160M). NAVX governance token captures protocol revenue; closest Sui analog to aave-v3 on Ethereum.
    - slug: suilend
      name: Suilend
      category: Lending
      coingecko_id: suilend
      rationale: Second-largest Sui lending market (~$155M). Solend team's Sui pivot; SEND token launched 2024.
    - slug: cetus-clmm
      name: Cetus CLMM
      category: DEX
      coingecko_id: cetus-protocol
      rationale: Primary Sui DEX (concentrated liquidity, Uniswap-v3-style). CETUS token captures fee share.
    - slug: scallop-lend
      name: Scallop Lend
      category: Lending
      coingecko_id: scallop-2
      rationale: Third-leg Sui lending diversification (~$22M TVL). SCA token; CoinGecko id is `scallop-2` because of a name collision (the original `scallop` id was taken).
    - slug: bluefin-spot
      name: Bluefin Spot
      category: DEX
      coingecko_id: bluefin
      rationale: Sui spot DEX; pairs with bluefin-pro for derivatives volume cross-check. BLUE token shared across spot + perps.
    - slug: bluefin-pro
      name: Bluefin Pro
      category: Derivatives
      coingecko_id: bluefin
      rationale: Sui on-chain perps. Same BLUE token as bluefin-spot; separate TVL stream tracks derivatives demand specifically.
    - slug: deepbook-v3
      name: DeepBook V3
      category: DEX
      coingecko_id: deepbook
      rationale: Sui Foundation's native on-chain orderbook DEX. Lower TVL than AMMs ($17M) but represents core Sui infrastructure; DEEP token is the canonical Sui-native fee asset.
