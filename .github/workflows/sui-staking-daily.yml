name: Sui Staking Daily Snapshot

# B-088 — pulls the current Sui mainnet epoch's per-validator state from
# the public fullnode JSON-RPC and writes one row per validator into
# onchain.sui_validators. Runs on the self-hosted Beelink runner so it
# can reach the homelab Postgres on mission_control_net.
#
# Sui epoch cadence is ~24h. Daily cron at 06:00 UTC catches each epoch
# roll-over reliably without crowding the morning ingest window used by
# the other ETF / equity daily crons. Idempotent via the (epoch,
# validator_address) PK so re-runs within the same epoch are no-op
# upserts.
#
# No backfill input — the public Sui RPC only returns the current epoch's
# state (suix_getEpochs returns "Method not found" on the public fullnode).
# Historical reconstruction would need an indexer-side path; deferred as
# a v2 follow-up if pursued.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Sui staking RPC collect (Postgres-backed)
    runs-on: [self-hosted, beelink]
    timeout-minutes: 10
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Collect Sui validator snapshots into onchain.sui_validators
        run: |
          bash scripts/ci/retry.sh 3 10 -- python3 -m genkei.ingest.sui_staking
