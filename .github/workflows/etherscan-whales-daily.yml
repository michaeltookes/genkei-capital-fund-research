name: Etherscan Whale-Flow Daily Snapshot

# B-106 — snapshots per-address ETH balance + 24h net flow for the
# curated wallets in config/watchlists.yml → eth_whale_addresses. Runs on
# the self-hosted Beelink runner so it can reach the homelab Postgres on
# mission_control_net. Reuses the ETHERSCAN_API_KEY already configured
# for B-082 / B-086 (no new secret required).
#
# Cadence: daily at 14:00 UTC. Sits AFTER ishares-daily (13:00 UTC) and
# well before the next sui-staking-daily run at 06:00 UTC the next
# morning. The 14:00 slot deliberately runs in the middle of the US
# trading day so the snapshot captures the prior 24h ending mid-day,
# matching when most CEX-flow research happens.
#
# Idempotent on (address, ts) PK — re-runs within the same UTC day
# overwrite earlier-in-day numbers with later ones. No backfill mode
# wired into the cron; manual --since YYYY-MM-DD runs (workflow_dispatch
# with a since input) handle historical backfill.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Optional YYYY-MM-DD lower bound for backfill mode"
        required: false
        type: string

permissions:
  contents: read

jobs:
  pipeline:
    name: ETH whale-flow snapshot (Postgres-backed)
    runs-on: [self-hosted, beelink]
    timeout-minutes: 30
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Collect ETH whale-flow snapshots into onchain.eth_whale_flows
        env:
          SINCE: ${{ inputs.since || '' }}
        run: |
          args=()
          if [ -n "$SINCE" ]; then
            args+=(--since "$SINCE")
          fi
          python3 -m genkei.ingest.etherscan_whale_flow "${args[@]}"
