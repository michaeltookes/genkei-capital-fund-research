name: SEC ETF Shares Backfill Daily

# B-114 — extracts quarter-end shares-outstanding + net assets from each
# CIK-tagged ETF trust's SEC 10-Q/10-K XBRL companyfacts and lands the derived
# quarterly checkpoints into etf.fund_snapshots (source_endpoint='sec_10q_xbrl').
# Reconstructs the pre-daily-feed AUM trajectory for IBIT / ETHA / ETHB back to
# inception. Runs on the self-hosted Beelink runner so it can reach the homelab
# Postgres on mission_control_net.
#
# 10-Qs land quarterly, but the run is cheap (3 companyfacts fetches) and
# idempotent — DO NOTHING on the (ticker, snapshot_date) PK means most daily
# runs insert nothing and never clobber the authoritative daily-feed rows. A
# daily cadence keeps the health heartbeat fresh (staleness window is 36h) and
# picks up a new 10-Q within a day of filing. 13:15 UTC — just after the
# iShares/Bitwise daily snapshot crons (13:00) so the two never race on the
# shared table.

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: SEC 10-Q ETF shares backfill (Postgres-backed)
    runs-on: [self-hosted, beelink]
    timeout-minutes: 10
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Backfill quarter-end ETF shares into etf.fund_snapshots
        run: |
          bash scripts/ci/retry.sh 3 10 -- python3 -m genkei.ingest.sec_etf_shares
