name: Coinbase Daily OHLCV

# B-035 — pulls Coinbase Exchange daily OHLCV candles for every
# watchlist entry with `coinbase_product` set, once a day on the
# self-hosted Beelink runner. 12:00 UTC chosen after FRED (11:00),
# SEC (11:30), and CoinGecko (11:45) so the four workloads don't fight
# for the runner. No API key required.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coinbase-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Coinbase collect + normalize (Postgres-backed)
    runs-on: [self-hosted, beelink]
    timeout-minutes: 15
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Collect Coinbase candles into meta.raw_blobs
        id: collect
        run: |
          output="$(bash scripts/ci/retry.sh 3 10 -- python3 -m genkei.ingest.coinbase)"
          echo "$output"
          run_id_line="$(printf '%s\n' "$output" | grep 'ingest_run_id=' | tail -n 1 || true)"
          source_run_id="${run_id_line##*=}"
          if [ -z "$source_run_id" ] || [ "$source_run_id" = "$run_id_line" ]; then
            echo "Could not parse Coinbase collector run id from output: $output" >&2
            exit 1
          fi
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"

      - name: Normalize raw payloads into coinbase.candles
        run: python3 -m genkei.normalize.coinbase --source-run-id "${{ steps.collect.outputs.source_run_id }}"

      - name: Emit relative-strength signal events (B-098)
        # Reads the freshly-normalized coinbase.candles for each watchlist
        # crypto asset, computes the trailing-30d return vs BTC, and
        # emits ONE event per crossing onset into laggard / leader state
        # (not per day in-state, same episode-onset model as
        # tvl_drawdown_emitter). Pairs with B-095 to fire the
        # crypto_tvl_stress_combo rule. 90-day rolling --since absorbs
        # cron-failure gaps; old onsets are no-ops via the UNIQUE
        # constraint on (asset, ts, source, signal_kind, source_ref,
        # horizon).
        run: |
          python3 -m genkei.experiments.emitters.relative_strength_emitter \
            --since "$(date -u -d '90 days ago' '+%Y-%m-%d')"
