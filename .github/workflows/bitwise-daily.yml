name: Bitwise Daily ETF Snapshots

# B-113 — second-issuer expansion of the B-107 spot-crypto-ETF net-flow
# signal. Parses the Bitwise product page(s) and lands daily NAV /
# net-assets / shares-outstanding snapshots for BITB into etf.fund_snapshots,
# alongside the iShares (IBIT/ETHA/ETHB) rows. Runs on the self-hosted
# Beelink runner so it can reach the homelab Postgres on mission_control_net.
#
# Bitwise publishes T+1/T+2 NAV strikes on the static product site. A daily
# cron at 13:30 UTC (~9:30am ET) catches the most recent strike well after
# Bitwise has published it, and staggers 30 min behind ishares-daily.yml so
# the two ETF collectors don't contend for the single runner. Idempotent via
# the (ticker, snapshot_date) PK so a missed run is harmless: the next run
# upserts the same snapshot.
#
# No backfill input — the product page only carries the current snapshot,
# not historical NAVs. Historical backfill is the SEC 10-Q quarter-end
# follow-up (B-114).

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Bitwise product-page collect (Postgres-backed)
    runs-on: [self-hosted, beelink]
    timeout-minutes: 10
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Collect Bitwise ETF snapshots into etf.fund_snapshots
        run: |
          bash scripts/ci/retry.sh 3 10 -- python3 -m genkei.ingest.bitwise
