name: Workflow Failure Alert

# B-071 — open or update a GitHub issue when a watched workflow fails.
# Listens to `workflow_run: types: [completed]` for every daily ingest,
# the CI test workflow, and the staleness checker. On a failure/timeout
# conclusion, opens a per-workflow issue (or comments on the existing open one)
# so silent overnight failures show up the next time someone looks at the repo.
#
# Why workflow_run (centralized) instead of `if: failure()` (per-workflow)?
# One file to maintain, captures every workflow without per-workflow
# surgery, and the issue-management logic only lives in one place.
#
# Why not also alert on `cancelled`? Most cancellations are deliberate
# (push during running job, manual cancel). The `Claude Code Review`
# workflow specifically cancels in-progress runs on every push, which
# would spam this alerter with non-actionable noise.

on:
  workflow_run:
    # Every scheduled ingest workflow + CI + the two health checks. This
    # list previously covered only 6 of the 14 ingest workflows, so
    # failures in BEA / EIA / CFTC / Etherscan / GDELT / iShares /
    # Sui-staking / Sui-unlocks / Treasury were silent (B-119). Keep it in
    # sync when a new ingest workflow lands.
    workflows:
      - "Tests"
      - "DeFiLlama Daily Pipeline"
      - "CoinGecko Daily Market Data"
      - "Coinbase Daily OHLCV"
      - "Yahoo Daily Equity OHLCV"
      - "FRED Daily Macro"
      - "BEA Daily Macro"
      - "Treasury Daily Fiscal Data"
      - "EIA Daily Energy Data"
      - "SEC EDGAR Daily"
      - "CFTC Weekly COT"
      - "GDELT GKG Daily Snapshot"
      - "iShares Daily ETF Snapshots"
      - "Bitwise Daily ETF Snapshots"
      - "SEC ETF Shares Backfill Daily"
      - "Etherscan Whale-Flow Daily Snapshot"
      - "Sui Staking Daily Snapshot"
      - "SUI Unlocks Daily Snapshot"
      - "On-chain Staking Daily Snapshot"
      - "Zcash Usage Daily Snapshot"
      - "Weekly Signal Digest"
      - "Watchlist Scoring Daily"
      - "Anomaly Detection Daily"
      - "Threshold Alerts Daily"
      - "Trend Views Daily Refresh"
      - "Ingest Staleness Check"
      - "Ingest Heartbeat"
      - "Backup Staleness Check"
      - "API Health Check"
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  alert:
    # Only act on failures/timeouts. `cancelled` and `success` are ignored.
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          TITLE="[workflow-failure] ${WORKFLOW_NAME}"
          SHORT_SHA="${COMMIT:0:7}"
          DETECTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Exact-title match (not GitHub's fuzzy search) — keeps each
          # workflow's failures on its own issue rather than collapsing
          # workflows whose titles share words.
          EXISTING_NUMBER=$(gh issue list \
              --state open \
              --limit 1000 \
              --json number,title \
              --jq ".[] | select(.title == \"${TITLE}\") | .number" \
              | head -1)

          if [ -n "${EXISTING_NUMBER}" ]; then
              gh issue comment "${EXISTING_NUMBER}" --body "Completed with **${CONCLUSION}** again on \`${BRANCH}\` @ \`${SHORT_SHA}\` (event: \`${EVENT}\`).
          Run: ${WORKFLOW_URL}
          Detected: ${DETECTED}"
              echo "Commented on existing issue #${EXISTING_NUMBER}."
          else
              gh issue create \
                  --title "${TITLE}" \
                  --body "The **${WORKFLOW_NAME}** workflow completed with **${CONCLUSION}**.

          - Branch: \`${BRANCH}\`
          - Commit: \`${SHORT_SHA}\`
          - Triggering event: \`${EVENT}\`
          - Run: ${WORKFLOW_URL}
          - Detected at: ${DETECTED}

          ---

          Auto-opened by \`.github/workflows/workflow-failure-alert.yml\` (B-071).
          Close manually once the underlying issue is resolved; repeated failures
          on the same workflow will add comments to this issue rather than open
          new ones."
              echo "Opened new failure issue for ${WORKFLOW_NAME}."
          fi

      - name: Ping Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "🔴 ${{ github.event.workflow_run.name }} — ${{ github.event.workflow_run.conclusion }}"
          description: |
            Workflow **${{ github.event.workflow_run.name }}** completed with **${{ github.event.workflow_run.conclusion }}** on `${{ github.event.workflow_run.head_branch }}`.
            A GitHub issue was opened or updated with the details.
          url: ${{ github.event.workflow_run.html_url }}
          color: "15158332"
