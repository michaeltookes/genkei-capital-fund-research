name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-integration:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev extras
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Run unittest discover
        # GH-hosted Ubuntu runners ship Docker, so testcontainers can spin
        # up the TimescaleDB image and the integration tests under
        # tests/migrations/ + tests/common/test_db_integration.py exercise
        # real Postgres. The mock-based suite runs in the same invocation.
        # Ryuk is disabled above so CI does not need an extra Docker Hub
        # pull before starting the TimescaleDB container.
        run: python3 -m unittest discover -s tests

      - name: Compile-check
        run: python3 -m compileall src tests migrations
