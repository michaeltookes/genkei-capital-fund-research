name: Zcash Usage Daily Snapshot

# ZEC usage ingester — pulls the Zcash node's valuePools (shielded share of
# supply) from zcashexplorer.app/api/v1/blockchain-info and lands one daily
# snapshot per pool into zcash.shielded_pools. Closes the usage gap from the
# 2026-07-06 ZEC research decision. Runs on the self-hosted Beelink runner so
# it can reach the homelab Postgres on mission_control_net.
#
# Forward-only: the source exposes only the current chain state, so each run
# appends today's snapshot; the shielded-share TREND builds up over time.
# Idempotent via the (pool, snapshot_date) PK, so a missed or re-run day is
# harmless. Daily cron at 06:00 UTC (chain state is continuous — any time is
# fine; 06:00 keeps it clear of the ETF/price crons).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Zcash shielded-pool snapshot (Postgres-backed)
    runs-on: [self-hosted, beelink]
    timeout-minutes: 10
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Collect Zcash shielded-pool snapshot into zcash.shielded_pools
        run: |
          bash scripts/ci/retry.sh 3 10 -- python3 -m genkei.ingest.zcash_usage
