name: DeFiLlama Daily Pipeline

# B-017 + B-018 moved the pipeline onto Postgres, so the scheduled job
# runs on the self-hosted runner that can reach the homelab database.
# The legacy daily markdown brief was retired in B-025 / D-024: the lake
# is the system of record, and the durable human-readable artifact is now
# the weekly signal digest (genkei.reports.signal_digest), not a per-source
# daily brief. This workflow is collect → normalize → emit only.

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: DeFiLlama collect + normalize (Postgres-backed)
    runs-on: [self-hosted, beelink]
    timeout-minutes: 15
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Collect raw payloads into meta.raw_blobs
        run: bash scripts/ci/retry.sh 3 10 -- python3 -m genkei.ingest.defillama

      - name: Normalize raw payloads into defillama.* tables
        run: python3 -m genkei.normalize.defillama

      - name: Emit TVL-drawdown signal events (B-095)
        # Emits episode-onset TVL stress signals over a 120d retry window.
        run: |
          python3 -m genkei.experiments.emitters.tvl_drawdown_emitter \
            --since "$(date -u -d '120 days ago' '+%Y-%m-%d')"
