name: DeFiLlama Daily Brief

# B-017 + B-018 moved the pipeline onto Postgres, so the scheduled job
# runs on the self-hosted runner that can reach the homelab database.
# The daily-brief render step stays disabled pending B-025 (decide fate
# of the legacy markdown brief).

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: DeFiLlama collect + normalize (Postgres-backed)
    runs-on: [self-hosted, beelink]
    timeout-minutes: 15
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Collect raw payloads into meta.raw_blobs
        run: python3 -m genkei.ingest.defillama

      - name: Normalize raw payloads into defillama.* tables
        run: python3 -m genkei.normalize.defillama

      - name: Emit TVL-drawdown signal events (B-095)
        # Reads the freshly-normalized defillama.chain_tvl joined to
        # coinbase.candles to detect TVL-stress episode onsets per
        # crypto chain (ETH / SOL / SUI). Emits ONE event per episode
        # onset, not per day of continued firing, so a multi-week stress
        # run doesn't clutter meta.signal_events. The emitter loads the
        # full available aligned series regardless of --since (the
        # feature engineer needs >=90d of trailing history); the
        # rolling --since here bounds only the *emission* window. 120d
        # matches crowding's window — generous enough to absorb cron-
        # failure gaps without re-emitting old onsets (idempotent via
        # the (asset, ts, source, signal_kind, source_ref, horizon)
        # UNIQUE constraint).
        run: |
          python3 -m genkei.experiments.emitters.tvl_drawdown_emitter \
            --since "$(date -u -d '120 days ago' '+%Y-%m-%d')"

      # Daily-brief render step intentionally omitted: B-025 will decide
      # whether the markdown brief gets rewritten against Postgres or
      # retired entirely.
