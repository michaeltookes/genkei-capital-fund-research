name: DeFiLlama Daily Brief

# B-017 + B-018 moved the pipeline onto Postgres. The workflow can no
# longer read/write JSON artifacts from a GH-hosted runner because
# GH-hosted runners cannot reach the homelab Postgres (double NAT). The
# scheduled trigger is restored, but DB-dependent steps are skipped on
# GH-hosted runners until B-077 lands a self-hosted runner on the Beelink.
# The daily-brief render step also stays disabled pending B-025 (decide
# fate of the legacy markdown brief).

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: DeFiLlama collect + normalize (Postgres-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GENKEI_DATABASE_URL: ${{ secrets.GENKEI_DATABASE_URL }}
    # When B-077 lands the self-hosted runner, switch this to:
    #   runs-on: [self-hosted, beelink]
    # and re-enable the schedule above.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Collect raw payloads into meta.raw_blobs
        if: ${{ runner.environment == 'self-hosted' && env.GENKEI_DATABASE_URL != '' }}
        run: python3 -m genkei.ingest.defillama

      - name: Normalize raw payloads into defillama.* tables
        if: ${{ runner.environment == 'self-hosted' && env.GENKEI_DATABASE_URL != '' }}
        run: python3 -m genkei.normalize.defillama

      # Daily-brief render step intentionally omitted: B-025 will decide
      # whether the markdown brief gets rewritten against Postgres or
      # retired entirely.
