# Genkei Capital research-desk — watchlists
#
# Single source of truth for which assets the data lake tracks. Loaded by
# every crypto ingester (CoinGecko, Binance, DefiLlama, etc.) and mirrored
# into `meta.watchlists` in Postgres at ingest time.
#
# Tiers explained:
# - `primary`   = full coverage. Prices, on-chain/TVL exposure where
#                 relevant, backfill, and every signal pipeline by default.
# - `secondary` = lighter coverage. Prices + core metrics; not pulled into
#                 every cross-source signal automatically.
#
# Sleeves (orthogonal to tier — see CLAUDE.md):
# - `core`     = long-term hold, Buffett-style. Selling not on the table.
# - `tactical` = turnover-eligible; signals can argue for trimming/adding.
#
# Equities and macro series are still TBD — see backlog item B-015.

version: 1

crypto:
