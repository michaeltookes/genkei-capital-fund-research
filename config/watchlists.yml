# Macro series watchlist.
#
# Format mirrors FRED series IDs (e.g. DGS10, CPIAUCSL). Macro is the spine
# of the investment philosophy (CLAUDE.md), so this set should grow first
# when something feels under-covered.
#
# Note on DXY: the ICE U.S. Dollar Index (DXY) isn't a FRED series. The
# closest equivalents are DTWEXBGS (broad trade-weighted) or DTWEXAFEGS
# (advanced foreign economies). DXY itself is sourced from market data
# (CoinGecko / equity providers) when needed — added as a placeholder
# entry below in the dollar section.
#
# STARTER SET BELOW — please review and edit before we close B-015.
macro_series:
  # Rates
  - id: DFF
    name: Federal Funds Effective Rate
    rationale: Fed policy stance; the entire short end of the curve pivots off this.
  - id: DGS2
    name: 2-Year Treasury Yield
    rationale: Market's expected path of the policy rate.
  - id: DGS10
    name: 10-Year Treasury Yield
    rationale: Risk-free benchmark; equity discount-rate input; growth signal.
  - id: T10Y2Y
    name: 10Y-2Y Treasury Spread
    rationale: Yield-curve slope; recession-signal proxy.
  - id: DGS30
    name: 30-Year Treasury Yield
    rationale: Long-end inflation/term-premium read.

  # Inflation
  - id: CPIAUCSL
    name: Consumer Price Index (All Urban Consumers)
    rationale: Headline inflation; drives Fed policy expectations.
  - id: PCEPI
    name: PCE Price Index
    rationale: Fed's preferred inflation gauge.

  # Growth + labor
  - id: GDPC1
    name: Real GDP
    rationale: Quarterly growth pulse; regime-classifier input.
  - id: UNRATE
    name: Unemployment Rate
    rationale: Labor-market slack; Fed dual-mandate input.
  - id: PAYEMS
    name: Total Nonfarm Payrolls
    rationale: Monthly employment momentum.
  - id: INDPRO
    name: Industrial Production Index
    rationale: Real-economy activity in goods-producing sectors.

  # Liquidity / money
  - id: WALCL
    name: Federal Reserve Balance Sheet (All Liabilities and Capital)
    rationale: Fed liquidity provision; risk-asset tide.
  - id: M2SL
    name: M2 Money Supply
    rationale: Broad money aggregate; long-run inflation/asset-price input.

  # Dollar
  - id: DTWEXBGS
    name: Trade-Weighted U.S. Dollar Index (Broad, Goods + Services)
    rationale: Closest FRED equivalent to DXY; risk-asset crosswind.

  # Credit
  - id: BAMLH0A0HYM2
    name: ICE BofA US High Yield Index Option-Adjusted Spread
    rationale: HY credit spread; risk appetite + recession signal.

  # Volatility / risk
  - id: VIXCLS
    name: CBOE VIX Volatility Index
    rationale: Equity-vol regime indicator.

  # Housing
  - id: HOUST
    name: Housing Starts
    rationale: Rate-sensitive sector pulse; consumer-cycle input.

  # Sentiment
  - id: UMCSENT
    name: University of Michigan Consumer Sentiment
    rationale: Consumer mood; spending leading indicator.

  # Commodities
  - id: DCOILWTICO
    name: WTI Crude Oil Spot Price
    rationale: Inflation + global-growth signal; energy-equity input.
  - id: GOLDAMGBD228NLBM
    name: Gold (London PM fix)
    rationale: Real-rate / debasement hedge; macro regime cross-check.
